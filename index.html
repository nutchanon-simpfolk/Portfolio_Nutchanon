<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simpfolk Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simpfolk — photographer and editor portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: Apple Store rhythm. Thin translucent nav, huge quiet headlines, rounded gray cards on white.
   Photographer = record crate (sleeve + spinning disc + fanned minis). Videographer = ScreenX cinema (center + two angled side screens).
   Palette: white / black / gray only. */
:root{
  --bg:#ffffff;
  --surface:#f5f5f7;
  --surface-2:#e8e8ed;
  --fg:#1d1d1f;
  --mute:#6e6e73;
  --accent:#d9480f;--gold:#b8860b;--gold-fg:#fff;
  --green:#1f7a3f;
  --line:rgba(0,0,0,.14);
  --glass:rgba(255,255,255,.8);
  --btn-bg:#1d1d1f;
  --btn-fg:#ffffff;
  --stage:#000000;
  --stage-fg:#f5f5f7;
  --shadow:rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Noto Sans Thai","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px);
  --r:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;--surface:#161617;--surface-2:#2a2a2d;--fg:#f5f5f7;--mute:#a1a1a6;--line:rgba(255,255,255,.18);
  --accent:#ff9a3c;--gold:#f0c14b;--gold-fg:#1d1d1f;--green:#34c759;--glass:rgba(22,22,23,.8);--btn-bg:#f5f5f7;--btn-fg:#1d1d1f;--shadow:rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#161617;--surface-2:#2a2a2d;--fg:#f5f5f7;--mute:#a1a1a6;--line:rgba(255,255,255,.18);
  --accent:#ff9a3c;--gold:#f0c14b;--gold-fg:#1d1d1f;--green:#34c759;--glass:rgba(22,22,23,.8);--btn-bg:#f5f5f7;--btn-fg:#1d1d1f;--shadow:rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.47 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.eyebrow{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.01em}
.h-xl{font-size:clamp(48px,9vw,112px);font-weight:700;letter-spacing:-.035em;line-height:1}
.h-l{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.h-m{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.12}
.lead{font-size:clamp(19px,2.2vw,26px);line-height:1.3;color:var(--mute);font-weight:500;letter-spacing:-.01em;max-width:34ch}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em}

/* photographer v2 (px-) */
.px-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 49px);z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.px-bar-in{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px}
.px-cats{display:flex;gap:6px;flex-wrap:wrap}
.px-cats button{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer;transition:background .2s,color .2s}
.px-cats button:hover{color:var(--fg)}
.px-cats button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.px-cats button.gold{color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold);font-weight:600}
.px-cats button.gold:hover{color:var(--gold)}
.px-cats button.gold[aria-pressed="true"]{background:var(--gold);color:var(--gold-fg);box-shadow:none}
.px-artists .px-blurb{margin-top:10px;max-width:60ch}
.ig-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}
@media (max-width:640px){.ig-grid{grid-template-columns:minmax(0,1fr)}}
.ig{background:var(--surface);border-radius:var(--r);padding:clamp(16px,2.4vw,26px)}
.ig-tops{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.ig.wide{grid-column:1/-1}
.ig-ids{display:flex;flex-wrap:wrap;gap:14px clamp(24px,4vw,56px);min-width:0}
@media (max-width:640px){.ig-ids{flex-direction:column}}
.ig-top{display:flex;align-items:center;gap:14px}
.ig-av{flex:none;width:88px;height:88px;border-radius:50%;padding:3px;background:conic-gradient(var(--gold),#fff3c4,var(--gold),#8a6508,var(--gold))}
.ig-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 22%;border:3px solid var(--surface);display:block}
.ig-id{min-width:0;display:flex;flex-direction:column;gap:3px}
.ig-id b{font-size:18px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.ig-id span{font-size:13px;color:var(--mute)}
.ig-btn{margin-top:6px;align-self:flex-start;font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;border:1.5px solid var(--gold);color:var(--gold);text-decoration:none;transition:background .2s,color .2s}
.ig-btn:hover,.ig-btn:focus-visible{background:var(--gold);color:var(--gold-fg)}
.ig-posts{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px}
/* every card: one justified row that fills the width, no empty space; cards keep their own height */
.ig-posts{flex-wrap:nowrap}
.ig-posts:not(.mix) button{flex-basis:0!important;min-width:0}
.ig-posts:not(.mix) img{width:100%;height:auto;display:block}
.ig{align-self:start}
/* masonry: cards pull up into free space (row unit 2px, spans set by pxMasonry) */
.ig-grid.mas{grid-auto-rows:2px;row-gap:0;grid-auto-flow:row dense}
.ig-grid.mas .ig{margin-bottom:18px}
/* 2 large vertical frames + 2 horizontal frames stacked in two tiers */
.hp{display:grid;gap:4px}
.hp-mix{display:grid;grid-template-columns:1fr 1fr 1.125fr;grid-template-rows:1fr 1fr;gap:4px;aspect-ratio:2.08/1}
.hp-mix .hp-t:nth-child(1){grid-area:1/1/3/2}.hp-mix .hp-t:nth-child(2){grid-area:1/2/3/3}.hp-mix .hp-t:nth-child(3){grid-area:1/3/2/4}.hp-mix .hp-t:nth-child(4){grid-area:2/3/3/4}
.hp-mix img{width:100%;height:100%;object-fit:cover}
.hp-row{display:flex;gap:4px}
.hp-row .hp-t{flex:var(--ar) 1 0;min-width:0}
.hp-row img{width:100%;height:auto;display:block}
.hp-t{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.hp-t::after{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.22);pointer-events:none}
.hp-t img{transition:opacity .2s}.hp-t:hover img{opacity:.85}
@media (max-width:640px){.hp-mix{grid-template-columns:1fr 1fr;grid-template-rows:none;aspect-ratio:auto}
 .hp-mix .hp-t:nth-child(1){grid-area:1/1;aspect-ratio:2/3}.hp-mix .hp-t:nth-child(2){grid-area:1/2;aspect-ratio:2/3}
 .hp-mix .hp-t:nth-child(3){grid-area:2/1/3/3;aspect-ratio:3/2}.hp-mix .hp-t:nth-child(4){grid-area:3/1/4/3;aspect-ratio:3/2}}
.ig-posts.mix{display:grid;grid-template-columns:1fr 1fr 1.125fr;grid-template-rows:1fr 1fr;aspect-ratio:2.08/1}
.ig-posts.mix::after{display:none}
.ig-posts.mix button:nth-child(1){grid-area:1/1/3/2}
.ig-posts.mix button:nth-child(2){grid-area:1/2/3/3}
.ig-posts.mix button:nth-child(3){grid-area:1/3/2/4}
.ig-posts.mix button:nth-child(4){grid-area:2/3/3/4}
.ig-posts.mix img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){
  .ig-posts.mix{grid-template-columns:1fr 1fr;grid-template-rows:none;aspect-ratio:auto}
  .ig-posts.mix button:nth-child(1){grid-area:1/1;aspect-ratio:2/3}
  .ig-posts.mix button:nth-child(2){grid-area:1/2;aspect-ratio:2/3}
  .ig-posts.mix button:nth-child(3){grid-area:2/1/3/3;aspect-ratio:3/2}
  .ig-posts.mix button:nth-child(4){grid-area:3/1/4/3;aspect-ratio:3/2}
}
.ig-posts button{padding:0;border:0;background:var(--surface-2);min-width:0;cursor:pointer;display:block;position:relative;border-radius:8px;overflow:hidden}
.ig-posts img{width:100%;height:auto;display:block;transition:opacity .2s}
.ig-posts button:hover img{opacity:.82}
.ig-more{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-size:clamp(22px,3.2vw,34px);font-weight:600}
.px-seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px}
.px-seg button{border:0;background:transparent;padding:6px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mute);cursor:pointer;transition:background .2s,color .2s}
.px-seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px var(--shadow)}
@media (max-width:560px){.px-bar-in{justify-content:center}.px-cats button{padding:7px 12px}}
.px-sec{--u:clamp(104px,13.4vw,176px);--gap:10px;--px-off:118px;padding-top:clamp(48px,8vw,96px);scroll-margin-top:var(--px-off)}
@media (max-width:560px){.px-sec{--px-off:168px}}
.px-mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.px-crate{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;background:var(--surface);border-radius:28px;padding:clamp(22px,4vw,56px);overflow:hidden}
.px-art{position:relative;container-type:inline-size;aspect-ratio:1.28/1}
.px-disc{position:absolute;left:34cqw;top:50%;width:64cqw;aspect-ratio:1;margin-top:-32cqw;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c0d 0 1.2px,#1c1c1e 1.2px 2.6px);box-shadow:0 12px 40px var(--shadow);animation:pxspin 9s linear infinite}
.px-disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.14) 14%,transparent 22% 58%,rgba(255,255,255,.1) 66%,transparent 74%)}
.px-disc-l{position:absolute;inset:32%;border-radius:50%;overflow:hidden;border:2px solid #111}
.px-disc-l img{width:100%;height:100%;object-fit:cover}
.px-disc-l::after{content:"";position:absolute;left:50%;top:50%;width:11%;aspect-ratio:1;border-radius:50%;background:#e9e9ec;transform:translate(-50%,-50%)}
@keyframes pxspin{to{transform:rotate(360deg)}}
.px-sleeve{position:absolute;left:0;top:50%;width:54cqw;aspect-ratio:4/5;margin-top:-34cqw;border:0;padding:0;border-radius:6px;overflow:hidden;background:#222;cursor:pointer;box-shadow:0 18px 48px var(--shadow);transition:transform .35s}
.px-sleeve:hover{transform:translateY(-6px) rotate(-1deg)}
.px-sleeve img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.px-info .h-l{margin-top:8px}
.px-blurb{color:var(--mute);margin-top:14px;max-width:36ch}
.px-info .px-mono+.px-mono{margin-top:10px}
.px-counts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}
.px-chip{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
@media (max-width:760px){.px-crate{grid-template-columns:1fr;border-radius:22px}.px-art{max-width:520px}}
.px-mag{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:var(--u);gap:var(--gap);margin-top:var(--gap)}
.px-tile{position:relative;overflow:hidden;border:0;padding:0;border-radius:14px;background:var(--surface);cursor:pointer;grid-column:span 3;grid-row:span 2;opacity:0;transform:translateY(14px);animation:pxrise .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes pxrise{to{opacity:1;transform:none}}
.px-tile.f,.px-tile.h2{grid-column:span 6;grid-row:span 4}
.px-tile.q3{grid-column:span 4;grid-row:span 3}
.px-tile.q4{grid-column:span 3;grid-row:span 3}
.px-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.px-tile:hover img{transform:scale(1.04)}
.px-cap{position:absolute;left:0;right:0;bottom:0;padding:36px 14px 12px;text-align:left;color:#fff;font-size:13px;line-height:1.35;background:linear-gradient(transparent,rgba(0,0,0,.72));opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.px-tile.f .px-cap{opacity:1;transform:none;font-size:15px;padding:56px 20px 18px}
.px-tile:hover .px-cap,.px-tile:focus-visible .px-cap{opacity:1;transform:none}
.px-cap b{display:block;font-weight:600}
.px-cap span{opacity:.82}
.px-tag{position:absolute;top:10px;left:10px;font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media (max-width:700px){
  .px-sec{--u:36vw;--gap:8px}
  .px-mag{grid-template-columns:repeat(2,minmax(0,1fr))}
  .px-tile,.px-tile.q3,.px-tile.q4,.px-tile.h2{grid-column:span 1;grid-row:span 2}
  .px-tile.f{grid-column:span 2;grid-row:span 3}
  .px-tile.last-odd{grid-column:span 2}
  .px-cap{opacity:1;transform:none;font-size:12px;padding:30px 10px 9px}
  .px-tile:not(.f) .px-cap span{display:none}
}
@media (prefers-reduced-motion:reduce){.px-disc{animation:none}.px-tile{opacity:1;transform:none;animation:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:980px;border:1px solid transparent;background:var(--btn-bg);color:var(--btn-fg);font-size:15px;font-weight:500;cursor:pointer;transition:opacity .2s,transform .2s}
.btn:hover{opacity:.82}
.btn:active{transform:scale(.97)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-light{background:#f5f5f7;color:#1d1d1f}
.btn-sm{min-height:34px;padding:0 16px;font-size:13px}
.link{display:inline-flex;align-items:center;gap:4px;font-size:17px;font-weight:500;cursor:pointer;background:none;border:0;padding:0}
.link::after{content:"›";font-size:1.3em;line-height:1;transition:transform .2s}
.link:hover::after{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:980px;background:var(--surface-2);font-size:14px}

/* mock banner */
.mock{background:var(--surface);color:var(--mute);font-size:12px;text-align:center;padding:8px 16px}
.mock b{color:var(--fg);font-weight:600}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:48px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em}
.nav-links{display:flex;gap:clamp(16px,3.2vw,40px);font-size:13px}
.nav-links a{color:var(--mute);transition:color .2s;padding-block:14px;position:relative}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--fg)}
.nav-links a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1.5px;background:var(--fg)}
.nav-end{display:flex;align-items:center;gap:8px}
.nav-links .short{display:none}
@media (max-width:480px){.nav-links .full{display:none}.nav-links .short{display:inline}}
@media (max-width:760px){
  .nav-in{flex-wrap:wrap;height:auto;row-gap:0;padding-top:6px}
  .brand{order:1}
  .nav-end{order:2}
  .nav-links{order:3;flex:0 0 100%;justify-content:space-between;gap:0;overflow-x:auto;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{padding:10px 4px;white-space:nowrap}
  .nav-links a[aria-current="page"]::after{bottom:4px}
}

/* page enter */
#view{min-height:70vh}
#view.in{animation:pageIn .6s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-head{padding-block:clamp(48px,8vw,104px) clamp(28px,4vw,56px)}
.page-head .lead{margin-top:18px}
.section{padding-block:clamp(40px,6vw,88px)}
.sec-head{margin-bottom:clamp(20px,3vw,36px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
@supports (animation-timeline: view()){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 38%}
  @keyframes rv{from{opacity:.15;transform:translateY(36px)}to{opacity:1;transform:none}}
}
.card{background:var(--surface);border-radius:var(--r);padding:clamp(22px,3vw,40px)}

/* info: explore cards */
.hero-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:clamp(24px,3vw,36px)}
.explore{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.explore{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ex{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--surface-2);padding:clamp(18px,2vw,26px);color:#fff;isolation:isolate}
.ex img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.ex::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.5),transparent 40%,rgba(0,0,0,.55))}
.ex:hover img{transform:scale(1.05)}
.ex small{font-size:13px;font-weight:600;opacity:.85}
.ex b{display:block;font-size:clamp(24px,2.6vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:4px}
.ex .plus{align-self:flex-end;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:#1d1d1f;display:grid;place-items:center;font-size:22px;line-height:1;font-weight:300}
.about-text{font-size:clamp(24px,3.6vw,44px);font-weight:600;letter-spacing:-.025em;line-height:1.14;max-width:26ch;color:var(--fg);text-wrap:balance}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.tl{display:flex;flex-direction:column;gap:14px}
.tl-i{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px 28px;padding-block:18px;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0;padding-top:0}
.tl-i:last-child{padding-bottom:0}
.tl-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tl-links .btn{min-height:34px;padding:0 16px;font-size:13px}
.tl-p{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl-i h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tl-i p{color:var(--mute);font-size:15px}
.tl-i ul{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:15px}
@media (max-width:560px){.tl-i{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.skill h3{font-size:19px;font-weight:600}
.soft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

.soft h3{font-size:19px;font-weight:600;margin-bottom:8px}

/* home */
.home-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(36px,6vw,88px) clamp(12px,2vw,24px)}
.hh-name{font-size:clamp(40px,6.2vw,80px);line-height:1.02;margin-top:8px;text-wrap:balance}
.hh-photo{aspect-ratio:4/5;max-width:460px;width:100%;justify-self:end;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}

.hrecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.hrecs{grid-template-columns:1fr}}
.hrec{display:flex;flex-direction:column;gap:clamp(16px,2vw,28px);background:var(--surface);border-radius:var(--r);padding:clamp(20px,3vw,40px);overflow:hidden;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.hrec:hover{transform:translateY(-4px)}
.hrec-t{display:flex;flex-direction:column;gap:4px}
.hrec-t .mono{color:var(--mute)}
.hrec-t h3{font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hrec-t p{color:var(--mute);font-size:15px}
.hrec-t .link{margin-top:8px;font-size:15px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;aspect-ratio:2/1}
.bento a{position:relative;display:block;overflow:hidden;border-radius:22px;background:var(--surface-2)}
.bento a:first-child{grid-column:1/3;grid-row:1/3}

.bento a:hover img{transform:scale(1.04)}
.bento .tag{position:absolute;left:12px;bottom:12px;padding:5px 11px;border-radius:980px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
@media (max-width:760px){.bento{aspect-ratio:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}.bento a{aspect-ratio:4/5}.bento a:first-child{grid-column:1/3;grid-row:auto}}
.vt{background:#000;color:#f5f5f7;border-radius:var(--r);padding:clamp(22px,3.5vw,48px)}
.vt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(20px,3vw,32px)}
.vt-head p{color:#a1a1a6;margin-top:8px}
.vt-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.vt-c{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#111;color:#fff}
.vt-c img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.vt-c::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.7))}
.vt-c:hover img{transform:scale(1.05)}
.vt-c .t{position:absolute;left:14px;bottom:12px;z-index:1;font-size:14px;font-weight:600}
@media (max-width:760px){.vt-row{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:42%;overflow-x:auto;scrollbar-width:none}.vt-row::-webkit-scrollbar{display:none}}
.btn-light-ghost{background:transparent;color:#f5f5f7;border-color:rgba(255,255,255,.4)}

/* resume (home) */
.resume-wrap{padding-top:clamp(20px,3vw,40px)}
.resume{background:var(--surface);border-radius:var(--r);padding:clamp(22px,4vw,56px)}
.r-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.r-photo{aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--surface-2)}
.r-photo img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute)}
.ph span{font-size:clamp(72px,10vw,120px);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--fg);opacity:.85}
.r-name{font-size:clamp(38px,5.6vw,72px);line-height:1.02;margin-top:6px;text-wrap:balance}
.r-full{color:var(--mute);font-size:18px;margin-top:6px}
.r-title{font-size:clamp(19px,2.2vw,26px);font-weight:600;letter-spacing:-.015em;margin-top:10px}
.tl{position:relative;margin-top:6px;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;display:flex;flex-direction:column;gap:3px;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--green)}
.tl-i:first-child::before{background:var(--green)}
.tl-p{font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:.02em}
.tl-i>span:not(.tl-p){color:var(--mute);font-size:14px}
.r-sum{color:var(--accent);font-weight:600;margin-top:14px;max-width:52ch}
.r-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:14px;color:var(--mute)}
.r-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);margin-top:clamp(28px,4vw,48px);padding-top:clamp(24px,3vw,36px);border-top:1px solid var(--line)}
.r-h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.r-i{padding-block:10px;border-top:1px solid var(--line)}
.r-i:first-of-type{border-top:0;padding-top:0}
.r-i b{display:block;font-weight:600;font-size:19px;line-height:1.3}
.r-i span{display:block;font-size:16px;color:var(--mute);line-height:1.45;margin-top:2px}
.r-sk{margin-bottom:12px}
.r-sk small{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.r-sk .chips{margin-top:0;gap:6px}
.r-ln{display:flex;align-items:center;gap:10px;margin-top:6px}
.r-ln:first-of-type{margin-top:0}
.r-ln>span{flex:none;width:44px;font-size:12px;color:var(--mute)}
.r-sk .chip{min-height:28px;padding:0 11px;font-size:13px}
@media (max-width:900px){.r-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.r-top{grid-template-columns:1fr}.r-photo{max-width:240px}.r-cols{grid-template-columns:1fr}}

/* editor */
.ba-box{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 8px);padding:clamp(18px,3.5vw,40px)}
.ba-box .sec-head{margin-bottom:clamp(16px,2.5vw,28px)}
.ba{max-width:min(100%,720px);margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.7fr);align-items:center;gap:clamp(10px,2.4vw,28px)}
.ba figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:2/3;background:var(--surface-2)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ba .tag{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:980px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
.ba .arr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg)}
.ba .arr svg{width:22px;height:22px}
@media (max-width:640px){.ba{grid-template-columns:minmax(0,1fr) auto minmax(0,1.6fr);gap:8px}.ba .arr{width:30px;height:30px}.ba .arr svg{width:16px;height:16px}.ba .tag{top:8px;left:8px;padding:4px 9px;font-size:11px}}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.reels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reel{position:relative;aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;background:var(--surface-2);color:#fff;display:flex;align-items:flex-end;padding:18px}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65))}
.reel-h{margin:34px 0 16px}
.reel-h:first-of-type{margin-top:8px}
.reel.can-play{cursor:pointer}
.reel.playing{padding:0;background:#000}
.reel.playing::before{display:none}
.reel.playing{aspect-ratio:auto;min-height:100%;display:block;overflow:visible;background:var(--surface-2)}
.reel.playing blockquote{margin:0!important}
.reel.playing iframe{display:block;max-width:100%;border:0;border-radius:var(--r)}
.reel.playing.yt{aspect-ratio:9/16;min-height:0;overflow:hidden;background:#000}
.reel.playing.yt iframe{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.reel span{position:relative;font-weight:600;font-size:15px}
.play{position:absolute;top:50%;left:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#1d1d1f}
.play svg{width:22px;height:22px;margin-left:3px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.step b{display:block;font-size:14px;color:var(--mute);font-weight:600;margin-bottom:28px;font-variant-numeric:tabular-nums}
.step h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.step p{color:var(--mute);font-size:15px}

/* photographer: record crate */
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border-radius:980px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 18px;border:0;border-radius:980px;background:transparent;color:var(--mute);font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.rec{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(20px,4vw,56px);align-items:center;margin-top:20px;overflow:hidden}
@media (max-width:860px){.rec{grid-template-columns:1fr}}
.rec-art{container-type:inline-size;position:relative;aspect-ratio:100/84;width:100%;max-width:640px;margin-inline:auto}
.rec-art>*{position:absolute}
.sleeve{left:13cqw;top:4cqw;width:58cqw;aspect-ratio:4/5;z-index:3;padding:0;border:0;border-radius:.6cqw;overflow:hidden;background:var(--surface-2);box-shadow:0 2.4cqw 6cqw var(--shadow);cursor:zoom-in;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.sleeve:hover{transform:translateY(-1cqw) rotate(-.6deg)}
.sleeve img{width:100%;height:100%;object-fit:cover;animation:swap .7s cubic-bezier(.2,.7,.2,1) both}
.disc{left:42cqw;top:12cqw;width:56cqw;aspect-ratio:1;border-radius:50%;z-index:2;background:radial-gradient(circle,#000 0 33%,transparent 33%),repeating-radial-gradient(circle,#0a0a0b 0 .45cqw,#232326 .45cqw .9cqw);box-shadow:0 1.4cqw 4cqw var(--shadow);animation:spin 10s linear infinite;transition:left .6s cubic-bezier(.2,.7,.2,1)}
.rec-art:hover .disc{left:46cqw}
.disc-l{position:absolute;inset:31%;border-radius:50%;overflow:hidden;border:.5cqw solid #111}
.disc-l img{width:100%;height:100%;object-fit:cover;transform:scale(1.5)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:2.2cqw;height:2.2cqw;margin:-1.1cqw;border-radius:50%;background:var(--surface)}
.mini{left:var(--x);top:var(--y);width:20cqw;aspect-ratio:4/5;z-index:1;padding:0;border:0;border-radius:.5cqw;overflow:hidden;background:var(--surface-2);box-shadow:0 .8cqw 2.4cqw var(--shadow);transform:rotate(var(--r));transition:transform .35s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.mini:hover{transform:translateX(-1.6cqw) rotate(var(--r))}
.mini img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swap{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.rec-info .mono{color:var(--mute)}
.rec-info h2{margin-top:10px}
.rec-info .blurb{color:var(--mute);margin-top:12px;max-width:34ch}
.rec-info .cap{margin-top:22px;font-size:14px;color:var(--mute);min-height:3em;max-width:38ch}
.rec-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.round:hover{background:var(--surface-2)}
.round svg{width:18px;height:18px}
.all{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s cubic-bezier(.2,.7,.2,1)}
.all.open{grid-template-rows:1fr}
.all>div{overflow:hidden;min-height:0}
.all-in{padding-top:clamp(28px,4vw,48px)}
.cols{columns:4;column-gap:10px}
@media (max-width:1000px){.cols{columns:3}}
@media (max-width:560px){.cols{columns:2;column-gap:8px}}
.tile{display:block;width:100%;margin:0 0 10px;padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--surface-2);break-inside:avoid;aspect-ratio:var(--ar);cursor:zoom-in}
@media (max-width:560px){.tile{margin-bottom:8px}}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.tile:hover img{transform:scale(1.04)}
.all.open .tile{animation:flip .7s calc(var(--i)*35ms) cubic-bezier(.2,.7,.2,1) both}
@keyframes flip{from{opacity:0;transform:perspective(900px) rotateX(-22deg) translateY(36px)}to{opacity:1;transform:none}}

/* videographer: ScreenX */
.cinema{position:relative;background:var(--stage);color:var(--stage-fg);border-radius:var(--r);overflow:hidden;padding:clamp(20px,3vw,44px) clamp(8px,2vw,28px) 0;isolation:isolate}
.ambient{position:absolute;inset:-20%;z-index:-1;background-size:cover;background-position:center;filter:blur(90px) saturate(1.5);opacity:.4;transition:background-image .6s}
.screens{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;perspective:1500px}
.scr{position:relative;overflow:hidden;background:#0c0c0d}
.scr-c{z-index:2;height:min(66vh,620px);aspect-ratio:9/16;border-radius:6px;box-shadow:0 0 140px rgba(255,255,255,.1)}
.scr-c>img{width:100%;height:100%;object-fit:cover;animation:swap .7s both}
.scr-s{height:min(58vh,540px);width:100%;max-width:300px}
.scr-s{border:0;padding:0;display:block;cursor:pointer;font:inherit;color:inherit;text-align:left}
.scr-s img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(1.5px) brightness(.62) saturate(1.1);transition:filter .3s}
.scr-s:hover img,.scr-s:focus-visible img{filter:blur(0) brightness(.9) saturate(1.1)}
.scr-s:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.sx-cap{position:absolute;left:12px;right:12px;bottom:14px;z-index:2;font-size:13px;font-weight:600;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.sx-cap small{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.scr-l .sx-cap{text-align:right;left:auto;right:18px;width:55%}
.scr-r .sx-cap{text-align:left;right:auto;left:18px;width:55%}
@media (max-width:640px){.sx-cap{display:none}}
.scr-l{justify-self:end;transform:rotateY(34deg);transform-origin:100% 50%;border-radius:6px 0 0 6px;-webkit-mask-image:linear-gradient(to right,transparent,#000 70%);mask-image:linear-gradient(to right,transparent,#000 70%)}
.scr-l img{object-position:center}
.scr-r{justify-self:start;transform:rotateY(-34deg);transform-origin:0 50%;border-radius:0 6px 6px 0;-webkit-mask-image:linear-gradient(to left,transparent,#000 70%);mask-image:linear-gradient(to left,transparent,#000 70%)}
.scr-r img{object-position:center}
@media (max-width:640px){.screens{grid-template-columns:minmax(0,14vw) auto minmax(0,14vw)}.scr-c{height:min(58vh,480px)}}
.scr .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(-120%);animation:shine 7s 1s ease-in-out infinite;pointer-events:none}
@keyframes shine{to{transform:translateX(120%)}}
.scr-c .play{background:rgba(255,255,255,.9)}
.scr-c .note{position:absolute;left:12px;right:12px;bottom:14px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);font-size:13px;line-height:1.35;text-align:center}
.scr-c.emb{background:#000}
.scr-c.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.floor{height:46px;margin-inline:-8%;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.16),transparent 65%)}
.cin-bar{display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;padding-block:6px 4px}
.cin-bar h2{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.02em}
.cin-bar .mono{color:#a1a1a6;display:block;margin-bottom:2px}
.tickets{display:flex;gap:10px;overflow-x:auto;padding:18px 2px 26px;scrollbar-width:none}
.tickets::-webkit-scrollbar{display:none}
.ticket{flex:0 0 78px;aspect-ratio:9/16;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:#1a1a1c;opacity:.5;cursor:pointer;transition:opacity .25s,transform .25s,border-color .25s}
.ticket:hover{opacity:.85}
.ticket[aria-current="true"]{opacity:1;border-color:#f5f5f7;transform:translateY(-4px)}
.ticket img{width:100%;height:100%;object-fit:cover}

/* other */
.films{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.films{grid-template-columns:minmax(0,1fr)}}
.film{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}

.film-v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:4px 11px;border-radius:980px;border:1px solid var(--line);font-size:12px;font-weight:600}
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.big2{grid-template-columns:1fr}}
.feat{border-radius:var(--r);padding:clamp(28px,4vw,56px);display:flex;flex-direction:column;gap:18px;min-height:clamp(360px,46vw,560px)}

/* contact + footer */
.contact{padding-block:clamp(56px,8vw,112px);scroll-margin-top:110px}
.contact .row{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;margin-top:28px}
.chan{margin-top:28px;max-width:820px;border-bottom:1px solid var(--line)}
.chan-r{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding-block:16px;border-top:1px solid var(--line)}
.chan-k{display:inline-flex;align-items:center;gap:8px;width:124px;color:var(--mute)}
.chan-k [data-ic]{display:inline-flex}
.ic{width:18px;height:18px;flex:none}
.r-contact{margin-top:clamp(20px,3vw,32px)}
.r-contact .r-h{padding-bottom:6px;border-bottom:1.5px solid var(--fg);color:var(--fg)}
.r-ct{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14px}
.r-ct a,.r-ct span{display:inline-flex;align-items:center;gap:10px;color:var(--fg);overflow-wrap:anywhere;min-width:0}
.r-ct a:hover{color:var(--mute)}
.r-ct .ic{flex:none;width:16px;height:16px}
.r-meta span{display:inline-flex;align-items:center;gap:7px}
.chan-r .email{flex:1 1 200px;min-width:0}
.email{font-size:clamp(17px,2vw,22px);font-weight:500;overflow-wrap:anywhere;user-select:all}
.foot{border-top:1px solid var(--line);padding-block:18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;font-size:12px;color:var(--mute)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:#000;color:#f5f5f7;display:flex;flex-direction:column}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:max(14px,env(safe-area-inset-top,0px)) max(var(--gut),env(safe-area-inset-right,0px)) 10px max(var(--gut),env(safe-area-inset-left,0px))}
.lb-top .mono{color:#a1a1a6}
.lb-top .mono b{color:#f5f5f7;font-weight:500}
.lb-x{width:44px;height:44px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:0;border-radius:50%;cursor:pointer;color:#f5f5f7}
.lb-x svg{width:18px;height:18px}
.lb-stage{--side:72px;position:relative;flex:1;min-height:0;margin:0;touch-action:pan-y}
.lb-stage img{position:absolute;top:0;bottom:0;left:var(--side);right:var(--side);width:calc(100% - 2*var(--side));height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-cap{margin:0;padding:12px max(var(--gut),env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(var(--gut),env(safe-area-inset-left,0px));color:#a1a1a6;font-size:13px;text-align:center;min-height:3.4em}
.lb-nav{position:absolute;top:50%;translate:0 -50%;width:48px;height:64px;display:grid;place-items:center;background:none;border:0;color:#f5f5f7;cursor:pointer;opacity:.75}
.lb-nav:hover{opacity:1}
.lb-nav svg{width:28px;height:28px}
.lb-prev{left:max(4px,env(safe-area-inset-left,0px))}
.lb-next{right:max(4px,env(safe-area-inset-right,0px))}
@media (max-width:640px){.lb-stage{--side:0px}.lb-nav{top:auto;bottom:calc(52px + env(safe-area-inset-bottom,0px));translate:none;height:48px;background:rgba(0,0,0,.55)}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* fixed vertical music player */
#site-music{position:fixed;z-index:1000;left:14px;top:50%;transform:translateY(-50%);width:184px;padding:14px 12px;border:1px solid var(--line);border-radius:16px;background:var(--glass);color:var(--fg);box-shadow:0 8px 30px var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);font-size:12px}
#site-music .sm-kicker{font:600 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
#site-music .sm-title{font-size:13px;line-height:1.35;font-weight:650;overflow-wrap:anywhere}
#site-music .sm-artist{font-size:11px;line-height:1.35;color:var(--mute);margin-top:4px}
#site-music .sm-controls{display:flex;align-items:center;gap:7px;margin-top:12px}
#site-music button{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;min-width:34px;height:32px;padding:0 10px;cursor:pointer}
#site-music button:focus-visible,#site-music input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#site-music .sm-volume{display:flex;align-items:center;gap:7px;margin-top:12px;color:var(--mute)}
#site-music input[type=range]{width:100%;min-width:0;accent-color:var(--fg)}
#site-music .sm-status{font-size:10px;line-height:1.35;color:var(--mute);margin-top:8px}
@media(max-width:760px){#site-music{left:8px;top:auto;bottom:10px;transform:none;width:min(220px,calc(100vw - 32px));padding:10px 11px}#site-music .sm-kicker{margin-bottom:5px}#site-music .sm-controls{margin-top:8px}#site-music .sm-volume{margin-top:7px}}
@media(prefers-reduced-motion:reduce){#site-music{scroll-behavior:auto}}

</style>
</head>
<body>


<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#home" id="brand">Simpfolk</a>
    <nav class="nav-links" id="nav-links" aria-label="Main"></nav>
    <div class="nav-end">
      <a class="btn btn-sm nav-book" href="#contact">Contact</a>
    </div>
  </div>
</header>

<main id="view"></main>

<section class="contact wrap" id="contact" aria-labelledby="h-contact">
  <p class="eyebrow">Contact</p>
  <h2 class="h-l" id="h-contact" style="margin-top:8px">Let’s make something.</h2>
  <div class="chan">
    <div class="chan-r"><span class="mono chan-k"><span data-ic="mail"></span>Email</span><span class="email" id="email-text"></span><button class="btn" type="button" id="copy-email">Copy email</button><a class="btn btn-ghost" id="mail-link" href="#contact">Send email</a></div>
    <div class="chan-r" id="line-row"><span class="mono chan-k"><span data-ic="chat"></span>LINE</span><span class="email" id="line-text"></span><button class="btn" type="button" id="copy-line">Copy ID</button><a class="btn btn-ghost" id="line-link" href="#contact" target="_blank" rel="noopener">Add on LINE</a></div>
    <div class="chan-r" id="ig-row" hidden><span class="mono chan-k"><span data-ic="camera"></span>Instagram</span><span class="email" id="ig-text"></span><span id="ig-btns" style="display:contents"></span></div>
    <div class="chan-r" id="tel-row" hidden><span class="mono chan-k"><span data-ic="phone"></span>Tel</span><span class="email" id="tel-text"></span><button class="btn" type="button" id="copy-tel">Copy number</button><a class="btn btn-ghost" id="tel-link" href="#contact">Call</a></div>
  </div>
  <div class="row" id="socials" style="margin-top:18px"></div>
</section>
<footer class="wrap foot">
  <span id="foot-c"></span>
  <a href="#top" data-top>Back to top ↑</a>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-top">
    <span class="mono" id="lb-count"></span>
    <button class="lb-x" type="button" id="lb-close" aria-label="Close viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>
  <button class="lb-nav lb-prev" type="button" id="lb-prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button>
  <figure class="lb-stage" id="lb-stage"><img id="lb-img" alt=""></figure>
  <button class="lb-nav lb-next" type="button" id="lb-next" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg></button>
  <p class="lb-cap" id="lb-cap"></p>
</div>

<script src="data.js"></script>
<script>
const S = window.SITE;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ARR_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ARR_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const IC = (() => {
  const w = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  return {
    mail: w('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>'),
    chat: w('<path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 3.5V16.5H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><path d="M8 9.5h8M8 12.5h5"/>'),
    camera: w('<path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>'),
    pin: w('<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
    phone: w('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>')
  };
})();

/* ---------- normalize data ---------- */
S.galleries.forEach(g => {
  g.photos = g.photos.map(p => typeof p === 'string' ? { f: p } : p);
  g.photos.forEach((p, i) => { p.n = i + 1; p.src = p.src || g.folder + p.f; p.gt = g.title; p.gid = g.id; p.cat = (S.categories && S.categories.length === 1) ? S.categories[0].id : (p.cat || p.t || 'portrait'); p.artist = p.artist || ''; p.event = p.event || ''; p.gcap = g.caption || ''; p.cap = [[p.artist, p.event].filter(Boolean).join(' · '), g.caption || ''].filter(Boolean).join(' · '); });
});
const ALL = S.galleries.flatMap(g => g.photos);
const CATDEF = (S.categories && S.categories.length) ? S.categories : [{ id: 'portrait', title: 'Portrait' }, { id: 'candid', title: 'Candid' }, { id: 'landscape', title: 'Landscape' }];
CATDEF.forEach(c => { c.items = ALL.filter(p => p.cat === c.id); });
ALL.forEach(p => { const c = CATDEF.find(x => x.id === p.cat); p.catTitle = c ? c.title : p.cat; });
const CATS = CATDEF.filter(c => c.items.length);
const AUDIOMAP = {}; S.galleries.forEach(g => { AUDIOMAP[g.id] = g.audio || ''; }); CATDEF.forEach(c => { AUDIOMAP[c.id] = c.audio || ''; });
const RECORDS = [
  ...S.galleries.map(g => ({ id: g.id, title: g.title, blurb: g.blurb, audio: g.audio || '', items: g.photos }))
].filter(r => r.items.length);
const ROUTES = [
  { id: 'home', label: 'Home' },
  { id: 'info', label: 'Info' },
  { id: 'editor', label: 'Editor' },
  { id: 'photographer', label: 'Photographer', short: 'Photo' },
  { id: 'other', label: 'Other' }
];
const pick = (src, alt) => ({ src, alt });
const cover = {
  editor: ALL.find(p => p.f === 'prangfah1.jpg') || ALL[0],
  photographer: ALL.find(p => p.f === 'ply1.jpg') || ALL[0],
  videographer: ALL.find(p => p.f === 'luna1.jpg') || ALL[0],
  other: ALL.find(p => p.f === 'faymay4.jpg') || ALL[0]
};

/* ---------- shell: nav, menu, contact ---------- */
$('#nav-links').innerHTML = ROUTES.map(r => `<a href="#${r.id}" data-r="${r.id}"><span class="full">${r.label}</span><span class="short">${r.short || r.label}</span></a>`).join('');
$('#email-text').textContent = S.contact.email;
$('#mail-link').href = 'mailto:' + S.contact.email + '?subject=' + encodeURIComponent('Inquiry');
const soc = [];
document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = IC[el.dataset.ic] || ''; });
const igs = (Array.isArray(S.contact.instagram) ? S.contact.instagram : String(S.contact.instagram || '').split(',')).map(x => x.trim().replace(/^@/, '')).filter(Boolean);
if (igs.length) {
  $('#ig-row').hidden = false;
  $('#ig-text').textContent = igs.map(h => '@' + h).join('  ·  ');
  $('#ig-btns').innerHTML = igs.map((h, i) => `<a class="btn${i ? ' btn-ghost' : ''}" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(h)}">Open @${esc(h)}</a>`).join('');
}
const tel = S.contact.phone || '';
const telFmt = /^\d{10}$/.test(tel) ? tel.replace(/(\d{3})(\d{3})(\d{4})/, '$1 $2 $3') : tel;
const metaHtml = () => [['mail', S.contact.email], S.contact.line && ['chat', 'LINE ' + S.contact.line], igs.length && ['camera', igs.map(h => '@' + h).join(' · ')], tel && ['phone', tel]]
  .filter(Boolean).map(([i, t]) => `<span>${IC[i]}${esc(t)}</span>`).join('');
if (S.contact.tiktok) soc.push(`<a class="chip" target="_blank" rel="noopener" href="https://www.tiktok.com/@${esc(S.contact.tiktok.replace(/^@/, ''))}">TikTok</a>`);
$('#socials').innerHTML = soc.join('');
$('#socials').hidden = !soc.length;
$('#foot-c').textContent = '© 2026 ' + S.name + '. All photographs belong to the photographer.';
const lineId = S.contact.line;
if (lineId) {
  $('#line-text').textContent = lineId;
  const bare = lineId.replace(/^@/, '');
  $('#line-link').href = lineId.startsWith('@') ? 'https://line.me/R/ti/p/%40' + encodeURIComponent(bare) : 'https://line.me/ti/p/~' + encodeURIComponent(bare);
} else $('#line-row').hidden = true;
function bindCopy(btn, text, el) {
  btn.addEventListener('click', async () => {
    const old = btn.textContent;
    try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
    catch (_) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = 'Press Ctrl/Cmd + C'; }
    setTimeout(() => btn.textContent = old, 1800);
  });
}
bindCopy($('#copy-email'), S.contact.email, $('#email-text'));
if (tel) { $('#tel-row').hidden = false; $('#tel-text').textContent = telFmt; $('#tel-link').href = 'tel:' + tel.replace(/[^\d+]/g, ''); bindCopy($('#copy-tel'), tel, $('#tel-text')); }
if (lineId) bindCopy($('#copy-line'), lineId, $('#line-text'));

/* ---------- views ---------- */
function homeView() {
  const I = S.info, P = S.profile || {}, H = S.home || {};
  const photo = P.photo
    ? `<img src="${esc(P.photo)}" alt="Portrait of ${esc(P.fullName || S.name)}">`
    : `<div class="ph" role="img" aria-label="Profile photo placeholder"><span>${esc(S.name.charAt(0))}</span><small class="mono">Photo placeholder</small></div>`;
  const recDefs = (H.records && H.records.length ? H.records : S.galleries.slice(0, 2).map(g => ({ id: g.id }))).slice(0, 2);
  const HMINI = [['0cqw', '6cqw', '-9deg'], ['2cqw', '28cqw', '-3deg'], ['0cqw', '50cqw', '7deg']];
  const recs = recDefs.map(d => {
    const g = S.galleries.find(x => x.id === d.id); if (!g) return null;
    const byF = f => g.photos.find(p => p.f === f);
    const main = byF(d.main) || g.photos[0];
    let minis = (d.minis || []).map(byF).filter(p => p && p !== main);
    if (!minis.length) minis = g.photos.filter(p => p !== main);
    return { g, main, minis: minis.slice(0, 3) };
  }).filter(Boolean);
  const recCards = recs.map(({ g, main, minis }, i) => `
    <a class="hrec" href="#photographer" data-goto-photo="${esc(g.id)}:${g.photos.indexOf(main)}" aria-label="Open the ${esc(g.title)} record, ${g.photos.length} frames">
      <div class="rec-art" data-aud="${esc(g.id)}">
        ${minis.map((p, j) => `<span class="mini" style="--x:${HMINI[j][0]};--y:${HMINI[j][1]};--r:${HMINI[j][2]}"><img src="${esc(p.src)}" alt="" loading="lazy"></span>`).join('')}
        <div class="disc" aria-hidden="true"><div class="disc-l"><img src="${esc(main.src)}" alt=""></div></div>
        <span class="sleeve"><img src="${esc(main.src)}" alt="${esc(main.alt)}" loading="lazy"></span>
      </div>
      <div class="hrec-t"><span class="mono">Record ${pad(i + 1)}</span><h3>${esc(g.title)}</h3><p>${g.photos.length} frames</p><span class="link">Open record</span></div>
    </a>`).join('');
  const vids = ((H.videos && H.videos.length) ? H.videos : [0, 1, 2, 3]).map(i => ({ v: S.videos[i], i })).filter(x => x.v).slice(0, 4);
  const meta = metaHtml();
  const edClips = reelGroups().flatMap(g => g.clips.slice(0, 2)).slice(0, 4);
  /* Home photography: plain photos (no IG card). order of prominence: faymay, prangfah, fah, ply */
  const pick = f => ALL.find(p => p.f === f);
  const hp = ['faymay6.jpg', 'faymay8.jpg', 'faymay4.jpg', 'faymay3.jpg', 'luna2.jpg', 'prangfah6.jpg', 'fah1.jpg', 'ply1.jpg'].map(pick).filter(Boolean);
  const poolN = ALL.filter(p => /^(faymay|prangfah|fah|ply)/.test(p.f)).length;
  const hpTile = (p, i, extra) => `<a href="#photographer" class="hp-t" style="--ar:${((p.w && p.h) ? p.w / p.h : .75).toFixed(3)}" aria-label="Open photographer page"><img src="${esc(p.src)}" alt="${esc(p.alt || '')}" width="${p.w || 400}" height="${p.h || 533}" loading="lazy">${extra ? `<span class="ig-more">+${extra}</span>` : ''}</a>`;
  const homePhotos = hp.length >= 8 ? `<div class="hp"><div class="hp-mix">${hp.slice(0, 4).map((p, i) => hpTile(p, i)).join('')}</div><div class="hp-row">${hp.slice(4).map((p, i, a) => hpTile(p, i, i === a.length - 1 ? poolN - hp.length : 0)).join('')}</div></div>` : '';
  return `
  <section class="wrap home-hero">
    <div>
      <p class="eyebrow">Hello, I’m</p>
      <h1 class="h-xl hh-name">${esc(P.fullName || S.name)}</h1>
      ${P.fullName ? `<p class="r-full">Nickname · ${esc(S.name)}</p>` : ''}
      <p class="r-title">${esc(P.title || S.roles.join(' · '))}</p>
      <p class="r-sum">${esc(P.intro || I.summary)}</p>
      <div class="r-meta">${meta}</div>
      <div class="hero-actions">
        <a class="btn" href="#contact">Contact</a>
        <a class="link" href="#info">Full resume</a>
      </div>
    </div>
    <div class="hh-photo">${photo}</div>
  </section>
  <section class="wrap section">
    <div class="sec-head rv"><div><p class="eyebrow">Selected work</p><h2 class="h-l" style="margin-top:6px">Photography</h2></div><a class="btn" href="#photographer">View all photos</a></div>
    ${homePhotos ? `<div class="rv">${homePhotos}</div>` : `${RECORDS.some(r => r.audio) ? '<p class="mono" style="color:var(--mute);margin:-8px 0 14px">♪ Hover a record to play its track</p>' : ''}<div class="hrecs rv">${recCards}</div>`}
  </section>
  <section class="wrap section" style="padding-top:0">
    <div class="vt rv">
      <div class="vt-head"><div><p class="eyebrow" style="color:#a1a1a6">Selected work</p><h2 class="h-l" style="margin-top:6px">Editor</h2><p>Video edits: A-roll and storytelling.</p></div><a class="btn btn-light" href="#editor">View all edits</a></div>
      <div class="vt-row">${edClips.map(v => `<a class="vt-c" href="#editor" aria-label="Open ${esc(v.title)}"><img src="${esc(v.cover)}" alt="" loading="lazy"><span class="play" aria-hidden="true">${PLAY}</span><span class="t">${esc(v.title)}</span></a>`).join('')}</div>
    </div>
  </section>`;
}

function infoView() {
  const I = S.info, P = S.profile || {};
  const ex = [['editor', 'Editor', 'Retouch, grade, cut'], ['photographer', 'Photographer', 'Artists & portraits'], ['other', 'Other', 'Events & KOL']]
    .map(([id, t, d]) => `<a class="ex rv" href="#${id}"><img src="${esc(cover[id].src)}" alt="" loading="lazy"><span><small>${esc(d)}</small><b>${t}</b></span><span class="plus" aria-hidden="true">+</span></a>`).join('');
  const photo = P.photo
    ? `<img src="${esc(P.photo)}" alt="Portrait of ${esc(P.fullName || S.name)}">`
    : `<div class="ph" role="img" aria-label="Profile photo placeholder"><span>${esc(S.name.charAt(0))}</span><small class="mono">Photo placeholder</small></div>`;
  return `
  <section class="wrap resume-wrap">
    <article class="resume" aria-label="Resume">
      <div class="r-top">
        <div class="r-photo">${photo}</div>
        <div>
          <p class="eyebrow">Resume</p>
          <h1 class="h-xl r-name">${esc(P.fullName || S.name)}</h1>
          ${P.fullName ? `<p class="r-full">Nickname · ${esc(S.name)}</p>` : ''}
          <p class="r-title">${esc(P.title || S.roles.join(' · '))}</p>
          <div class="hero-actions">
            <a class="btn" href="#contact">Contact</a>
            ${S.cv ? `<a class="btn btn-ghost" href="${esc(S.cv)}" target="_blank" rel="noopener">Download CV</a>` : ''}
          </div>
        </div>
      </div>
      <div class="r-cols">

    const [F, a, c, d, e] = list.slice(k, k + 5).map((p, j) => ({ p, idx: k + j }));

  }
  const r = list.length - k, cls = r === 1 || r === 2 ? 'h2' : r === 3 ? 'q3' : r === 4 ? 'q4' : '';
  for (let j = 0; j < r; j++) out.push({ p: list[k + j], idx: k + j, cls });

      /* share of the screen that is visible (or of the viewport, if the screen is taller than it) */
      const share = en.intersectionRect.height / Math.max(1, Math.min(en.boundingClientRect.height, innerHeight * .9));
      if (share >= .6 && !cinVis) { cinVis = true; paintVideo(true); }
      else if (share < .15 && cinVis) { cinVis = false; paintVideo(false); }
    }), { threshold: Array.from({ length: 21 }, (_, i) => i / 20) });
    autoIo.observe($('#screens'));
  }
  $('#cinema').addEventListener('click', e => {
    const t = e.target.closest('[data-v]'), s = e.target.closest('[data-vs]'), p = e.target.closest('#v-play');
    if (t) { vid = +t.dataset.v; paintVideo(cinVis); t.scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); }
    else if (s) { vid = (vid + +s.dataset.vs + S.videos.length) % S.videos.length; paintVideo(cinVis); }
    else if (p) { const u = S.videos[vid].url; if (CARD && u) openClip(u); else paintVideo(true, true); }
  });
}

function otherView() {
  const O = S.other;
  return `

  </section>` : ''}
  <section class="wrap section"><div class="big2">

  </div></section>

}

/* ---------- router ---------- */
const view = $('#view');
function route() {
  const id = (location.hash || '#home').slice(1);
  const r = ROUTES.some(x => x.id === id) ? id : 'home';
  if (autoIo) { autoIo.disconnect(); autoIo = null; }
  view.innerHTML = { home: homeView, info: infoView, editor: editorView, photographer: photographerView, videographer: videographerView, other: otherView }[r]();
  $('#contact').hidden = r === 'info'; /* on Info the contact details live inside the resume */
  if (r === 'info') document.querySelectorAll('[data-copy]').forEach(b => { const el = document.getElementById(b.dataset.copy); bindCopy(b, b.dataset.text || el.textContent, el); });
  if (r === 'editor') {
    document.querySelectorAll('.reel[data-tt],.reel[data-yt]').forEach(el => { el._orig = el.innerHTML; });
    const playReel = el => { if (!el || el.classList.contains('playing')) return; if (el.dataset.yt) { el.classList.add('playing', 'yt'); el.innerHTML = ytFrame(el.dataset.yt, 'Edit reel'); return; } if (!el.dataset.tt) return; if (CARD) { openClip(el.dataset.url); return; } el.classList.add('playing', 'yt'); el.innerHTML = ttFrame(el.dataset.tt, 'Edit reel'); };
    const stopReel = el => { if (!el.classList.contains('playing')) return; el.classList.remove('playing', 'yt'); el.innerHTML = el._orig; };
    if (AUTO) {
      autoIo = new IntersectionObserver(es => es.forEach(en => { if (en.intersectionRatio >= .6) playReel(en.target); else if (en.intersectionRatio < .15) stopReel(en.target); }), { threshold: [0, .15, .6] });
      document.querySelectorAll('.reel[data-tt],.reel[data-yt]').forEach(el => autoIo.observe(el));
    }
    document.querySelectorAll('.reels').forEach(rl => {
      rl.addEventListener('click', e => playReel(e.target.closest('.reel')));
      rl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const el = e.target.closest('.reel'); if (el && (el.dataset.tt || el.dataset.yt)) { e.preventDefault(); playReel(el); } } });
    });
  }
  if (r === 'other') {
    const fv = [...document.querySelectorAll('.film-v[data-yt]')];
    fv.forEach(el => { el._orig = el.innerHTML; });
    const on = el => { if (el.classList.contains('on')) return; if (CARD) { openClip(el.dataset.url); return; } el.classList.add('on'); el.innerHTML = ytFrame(el.dataset.yt, el.dataset.title); };
    const off = el => { if (!el.classList.contains('on')) return; el.classList.remove('on'); el.innerHTML = el._orig; };
    if (AUTO) {
      autoIo = new IntersectionObserver(es => es.forEach(en => { if (en.intersectionRatio >= .6) on(en.target); else if (en.intersectionRatio < .15) off(en.target); }), { threshold: [0, .15, .6] });
      fv.forEach(el => autoIo.observe(el));
    }
    fv.forEach(el => { el.addEventListener('click', () => on(el)); el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); on(el); } }); });
  }
  if (r === 'photographer') bindPhotographer();
  if (r === 'home') { pxMasonry(); document.querySelectorAll('.ig-grid img').forEach(i => { if (!i.complete) i.addEventListener('load', pxMasonry, { once: true }); }); }
  if (r === 'videographer') bindVideographer();
  syncMusicForPage(r);
  document.querySelectorAll('#nav-links a').forEach(a => a.getAttribute('data-r') === r ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  scrollTo({ top: 0, behavior: 'instant' });
  view.classList.remove('in'); void view.offsetWidth; view.classList.add('in');
}
/* if a video cover file is missing, fall back to `fb` (a photo) so no broken image shows */
[...S.videos, ...reelGroups().flatMap(g => g.clips)].forEach(v => {
  if (!v.fb || v.fb === v.cover) return;
  const t = new Image(); t.onerror = () => { v.cover = v.fb; if (document.querySelector('.cinema, .vt, .reels')) route(); }; t.src = v.cover;
});
/* ---------- page-aware music player ---------- */
const players = {}; let hovId = null, lockId = null, mx = 0, my = 0;
const TRACKS = {
  photos: { id:'photos', title:'Do you think you could love me', artist:'Yung Kai', src:'audio/Song_yung kai.mp3' },
  color: { id:'color', title:'BIRDS OF A FEATHER', artist:'Billie Eilish', src:'audio/Song_BIRDS OF A FEATHER .mp3' },
  bw: { id:'bw', title:'505', artist:'Arctic Monkeys', src:'audio/Song_505.mp3' }
};
let activeTrack = null, musicRoute = 'home', musicStarted = false;
const musicBox = document.getElementById('site-music');
const musicTitle = document.getElementById('sm-title');
const musicArtist = document.getElementById('sm-artist');
const musicToggle = document.getElementById('sm-toggle');
const musicVolume = document.getElementById('sm-volume');
const musicStatus = document.getElementById('sm-status');
function audioFor(id) {
  const track = TRACKS[id] || (AUDIOMAP[id] ? { id, title:id, artist:'', src:AUDIOMAP[id] } : null);
  if (!track || !track.src) return null;
  if (!players[id]) {
    const a = new Audio(encodeURI(track.src)); a.loop = true; a.preload = 'auto';
    a.volume = (Number(musicVolume.value) || 0) / 100;
    a.addEventListener('error', () => { if (activeTrack && activeTrack.id === id) musicStatus.textContent = 'ไฟล์เพลงไม่พบ — ตรวจสอบไฟล์ในโฟลเดอร์ audio'; });
    a.addEventListener('playing', () => { if (activeTrack && activeTrack.id === id) { musicStatus.textContent = 'กำลังเล่น'; musicToggle.textContent = 'Ⅱ Pause'; musicToggle.setAttribute('aria-label','Pause music'); } });
    a.addEventListener('pause', () => { if (activeTrack && activeTrack.id === id) { musicToggle.textContent = '▶ Play'; musicToggle.setAttribute('aria-label','Play music'); } });
    players[id] = a;
  }
  return players[id];
}
function fade(a, to, ms, done) {
  clearInterval(a._t); const s = a.volume, target = Math.max(0,Math.min(1,to)), t0 = performance.now();
  a._t = setInterval(() => {
    const k = Math.min(1,(performance.now()-t0)/ms); a.volume = Math.max(0,Math.min(1,s+(target-s)*k));
    if (k >= 1) { clearInterval(a._t); if (done) done(); }
  },40);
}
function recPlay(id) {
  const a = audioFor(id); if (!a) return;
  Object.values(players).forEach(other => { if (other !== a) { other.pause(); other.currentTime = 0; } });
  a.volume = (Number(musicVolume.value) || 0) / 100;
  const p = a.play();
  if (p && p.then) p.then(() => { musicStarted = true; musicStatus.textContent='กำลังเล่น'; }).catch(() => {
    musicStatus.textContent='กด Play เพื่อเริ่มเพลง (เบราว์เซอร์บล็อก autoplay)';
    musicToggle.textContent='▶ Play'; musicToggle.setAttribute('aria-label','Play music');
  });
}
function recStop(id) { const a = players[id]; if (a) { a.pause(); a.currentTime = 0; } }
function recLeave(force) { if (lockId && !force) return; }
function recSet(id) { if (id && TRACKS[id]) setMusicTrack(id, true); }
function setMusicTrack(id, autoplay) {
  const track = TRACKS[id]; if (!track) return;
  const changed = !activeTrack || activeTrack.id !== id;
  activeTrack = track; hovId = id;
  musicTitle.textContent = track.title; musicArtist.textContent = track.artist;
  musicBox.hidden = false;
  if (changed) {
    Object.entries(players).forEach(([key,a]) => { if (key !== id) { a.pause(); a.currentTime = 0; } });
    musicStatus.textContent = 'พร้อมเล่น';
    const a = audioFor(id);
    if (a) { a.currentTime = 0; a.volume = (Number(musicVolume.value) || 0) / 100; }
  }
  if (autoplay) recPlay(id);
}
function syncMusicForSection(sectionId) {
  if (musicRoute !== 'photographer' || pxMode !== 'color' || pxArtist) return;
  if (sectionId === 'px-bw') setMusicTrack('bw', true);
  else if (sectionId === 'px-color') setMusicTrack('color', true);
}
function syncMusicForPage(routeId) {
  musicRoute = routeId;
  if (routeId !== 'photographer') { Object.values(players).forEach(a => a.pause()); musicBox.hidden = true; return; }
  musicBox.hidden = false;
  if (pxMode === 'color' && !pxArtist) {
    const visible = document.querySelector('.px-sec[id="px-bw"]');
    const color = document.querySelector('.px-sec[id="px-color"]');
    const mid = innerHeight * .5;
    const bwTop = visible ? visible.getBoundingClientRect().top : Infinity;
    const colorTop = color ? color.getBoundingClientRect().top : Infinity;
    setMusicTrack(bwTop <= mid ? 'bw' : 'color', true);
  } else setMusicTrack('photos', true);
}
musicToggle.addEventListener('click', () => {
  if (!activeTrack) setMusicTrack('photos', false);
  const a = audioFor(activeTrack.id); if (!a) return;
  if (!a.paused) { a.pause(); musicStatus.textContent='หยุดเพลงแล้ว'; }
  else { recPlay(activeTrack.id); }
});
musicVolume.addEventListener('input', () => {
  const v = Number(musicVolume.value)/100;
  Object.values(players).forEach(a => { a.volume = v; });
});
document.addEventListener('pointerdown', () => {
  if (activeTrack) { const a = audioFor(activeTrack.id); if (a && a.paused && !musicStarted) recPlay(activeTrack.id); }
}, { once:true });
document.addEventListener('keydown', () => {
  if (activeTrack) { const a = audioFor(activeTrack.id); if (a && a.paused && !musicStarted) recPlay(activeTrack.id); }
}, { once:true });
addEventListener('scroll', () => {
  if (musicRoute !== 'photographer' || pxMode !== 'color' || pxArtist) return;
  const sections = [...document.querySelectorAll('#px-root .px-sec')];
  const current = sections.find(s => { const r=s.getBoundingClientRect(); return r.top < innerHeight*.58 && r.bottom > innerHeight*.3; });
  if (current) syncMusicForSection(current.id);
}, {passive:true});
addEventListener('hashchange', () => { lockId = null; recLeave(true); });
addEventListener('hashchange', route);

route();

/* ---------- in-page (non-route) links ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('.home-artists [data-at], [data-goto-artist]') && !e.target.closest('.ig-btn')) { goArtist = true; if (location.hash !== '#photographer') location.hash = '#photographer'; return; }
  const gp = e.target.closest('[data-goto-photo]');
  if (gp) { const [gid, i] = gp.dataset.gotoPhoto.split(':'); if (RECORDS.some(r => r.id === gid)) { pxMode = 'color'; recFocus = gid; } return; }
  const gv = e.target.closest('[data-goto-vid]');
  if (gv) { vid = +gv.dataset.gotoVid; return; }
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute('href').slice(1);
  if (ROUTES.some(x => x.id === id)) return;
  let t = a.hasAttribute('data-top') || id === 'top' ? document.body : document.getElementById(id);
  if (id === 'contact' && t && t.hidden) t = document.getElementById('r-contact');
  if (!t) return;
  e.preventDefault();
  t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
});

/* ---------- lightbox ---------- */
const lb = $('#lb'), lbImg = $('#lb-img');
let cur = { list: [], i: 0, opener: null };
const lbItem = p => ({ src: p.src, alt: p.alt || '', cap: p.cap || '', label: p.catTitle || p.gt || '', n: p.n, t: p.gt || p.t || '' });
function show() {
  const it = cur.list[cur.i];
  $('#lb-count').innerHTML = esc(it.label) + ' · <b>' + pad(it.n) + '</b> · ' + (cur.i + 1) + ' / ' + cur.list.length + (it.t ? ' · ' + esc(it.t) : '');
  $('#lb-cap').textContent = it.cap || it.alt; lbImg.alt = it.alt; lbImg.src = it.src;
  [-1, 1].forEach(d => { new Image().src = cur.list[(cur.i + d + cur.list.length) % cur.list.length].src; });
}
function step(d) { cur.i = (cur.i + d + cur.list.length) % cur.list.length; show(); }
function openLB(list, i, opener) { cur = { list, i, opener }; const z = opener && opener.closest && opener.closest('[data-aud]'); if (z) { lockId = z.dataset.aud; recSet(lockId); recPlay(lockId); } lb.hidden = false; document.body.style.overflow = 'hidden'; show(); $('#lb-close').focus(); }
function closeLB() { lb.hidden = true; lockId = null; recSet(recUnder()); document.body.style.overflow = ''; lbImg.removeAttribute('src'); if (cur.opener && document.contains(cur.opener)) cur.opener.focus(); }
$('#lb-close').addEventListener('click', closeLB);
$('#lb-prev').addEventListener('click', () => step(-1));
$('#lb-next').addEventListener('click', () => step(1));
$('#lb-stage').addEventListener('click', e => { if (e.target === e.currentTarget) closeLB(); });
document.addEventListener('keydown', e => {
  if (!lb.hidden) {
    if (e.key === 'Escape') closeLB();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Tab') {
      const f = [...lb.querySelectorAll('button')], a = f[0], z = f[f.length - 1];
      if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  }
});
let sx = null;
$('#lb-stage').addEventListener('pointerdown', e => { sx = e.clientX; });
$('#lb-stage').addEventListener('pointerup', e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
</script>
