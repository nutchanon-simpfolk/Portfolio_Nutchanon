<title>Simpfolk Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simpfolk — photographer, editor and videographer portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: Apple Store rhythm. Thin translucent nav, huge quiet headlines, rounded gray cards on white.
   Photographer = record crate (sleeve + spinning disc + fanned minis). Videographer = ScreenX cinema (center + two angled side screens).
   Palette: white / black / gray only. */
:root{
  --bg:#ffffff;
  --surface:#f5f5f7;
  --surface-2:#e8e8ed;
  --fg:#1d1d1f;
  --mute:#6e6e73;
  --accent:#d9480f;
  --green:#1f7a3f;
  --line:rgba(0,0,0,.14);
  --glass:rgba(255,255,255,.8);
  --btn-bg:#1d1d1f;
  --btn-fg:#ffffff;
  --stage:#000000;
  --stage-fg:#f5f5f7;
  --shadow:rgba(0,0,0,.28);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Noto Sans Thai","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut:clamp(16px,4vw,48px);
  --r:28px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000;--surface:#161617;--surface-2:#2a2a2d;--fg:#f5f5f7;--mute:#a1a1a6;--line:rgba(255,255,255,.18);
  --accent:#ff9a3c;--green:#34c759;--glass:rgba(22,22,23,.8);--btn-bg:#f5f5f7;--btn-fg:#1d1d1f;--shadow:rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#161617;--surface-2:#2a2a2d;--fg:#f5f5f7;--mute:#a1a1a6;--line:rgba(255,255,255,.18);
  --accent:#ff9a3c;--green:#34c759;--glass:rgba(22,22,23,.8);--btn-bg:#f5f5f7;--btn-fg:#1d1d1f;--shadow:rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.47 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:1280px;margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.eyebrow{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.01em}
.h-xl{font-size:clamp(48px,9vw,112px);font-weight:700;letter-spacing:-.035em;line-height:1}
.h-l{font-size:clamp(34px,5.4vw,64px);font-weight:700;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.h-m{font-size:clamp(24px,3vw,34px);font-weight:600;letter-spacing:-.02em;line-height:1.12}
.lead{font-size:clamp(19px,2.2vw,26px);line-height:1.3;color:var(--mute);font-weight:500;letter-spacing:-.01em;max-width:34ch}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:980px;border:1px solid transparent;background:var(--btn-bg);color:var(--btn-fg);font-size:15px;font-weight:500;cursor:pointer;transition:opacity .2s,transform .2s}
.btn:hover{opacity:.82}
.btn:active{transform:scale(.97)}
.btn-ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn-light{background:#f5f5f7;color:#1d1d1f}
.btn-sm{min-height:34px;padding:0 16px;font-size:13px}
.link{display:inline-flex;align-items:center;gap:4px;font-size:17px;font-weight:500;cursor:pointer;background:none;border:0;padding:0}
.link::after{content:"›";font-size:1.3em;line-height:1;transition:transform .2s}
.link:hover::after{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:980px;background:var(--surface-2);font-size:14px}

/* mock banner */
.mock{background:var(--surface);color:var(--mute);font-size:12px;text-align:center;padding:8px 16px}
.mock b{color:var(--fg);font-weight:600}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:48px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em}
.nav-links{display:flex;gap:clamp(16px,3.2vw,40px);font-size:13px}
.nav-links a{color:var(--mute);transition:color .2s;padding-block:14px;position:relative}
.nav-links a:hover,.nav-links a[aria-current="page"]{color:var(--fg)}
.nav-links a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:1.5px;background:var(--fg)}
.nav-end{display:flex;align-items:center;gap:8px}
.nav-links .short{display:none}
@media (max-width:480px){.nav-links .full{display:none}.nav-links .short{display:inline}}
@media (max-width:760px){
  .nav-in{flex-wrap:wrap;height:auto;row-gap:0;padding-top:6px}
  .brand{order:1}
  .nav-end{order:2}
  .nav-links{order:3;flex:0 0 100%;justify-content:space-between;gap:0;overflow-x:auto;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{padding:10px 4px;white-space:nowrap}
  .nav-links a[aria-current="page"]::after{bottom:4px}
}

/* page enter */
#view{min-height:70vh}
#view.in{animation:pageIn .6s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-head{padding-block:clamp(48px,8vw,104px) clamp(28px,4vw,56px)}
.page-head .lead{margin-top:18px}
.section{padding-block:clamp(40px,6vw,88px)}
.sec-head{margin-bottom:clamp(20px,3vw,36px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
@supports (animation-timeline: view()){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 38%}
  @keyframes rv{from{opacity:.15;transform:translateY(36px)}to{opacity:1;transform:none}}
}
.card{background:var(--surface);border-radius:var(--r);padding:clamp(22px,3vw,40px)}

/* info: explore cards */
.hero-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:clamp(24px,3vw,36px)}
.explore{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.explore{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ex{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--surface-2);padding:clamp(18px,2vw,26px);color:#fff;isolation:isolate}
.ex img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.ex::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.5),transparent 40%,rgba(0,0,0,.55))}
.ex:hover img{transform:scale(1.05)}
.ex small{font-size:13px;font-weight:600;opacity:.85}
.ex b{display:block;font-size:clamp(24px,2.6vw,34px);font-weight:700;letter-spacing:-.025em;line-height:1.05;margin-top:4px}
.ex .plus{align-self:flex-end;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);color:#1d1d1f;display:grid;place-items:center;font-size:22px;line-height:1;font-weight:300}
.about-text{font-size:clamp(24px,3.6vw,44px);font-weight:600;letter-spacing:-.025em;line-height:1.14;max-width:26ch;color:var(--fg);text-wrap:balance}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.tl{display:flex;flex-direction:column;gap:14px}
.tl-i{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px 28px;padding-block:18px;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0;padding-top:0}
.tl-i:last-child{padding-bottom:0}
.tl-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tl-links .btn{min-height:34px;padding:0 16px;font-size:13px}
.tl-p{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl-i h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.tl-i p{color:var(--mute);font-size:15px}
.tl-i ul{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:15px}
@media (max-width:560px){.tl-i{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.skill h3{font-size:19px;font-weight:600}
.soft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.soft-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.soft-grid{grid-template-columns:1fr}}
.soft h3{font-size:19px;font-weight:600;margin-bottom:8px}
.soft p{color:var(--mute);font-size:15px}

/* home */
.home-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(36px,6vw,88px) clamp(12px,2vw,24px)}
.hh-name{font-size:clamp(40px,6.2vw,80px);line-height:1.02;margin-top:8px;text-wrap:balance}
.hh-photo{aspect-ratio:4/5;max-width:460px;width:100%;justify-self:end;border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.hh-photo img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.home-hero{grid-template-columns:1fr}.hh-photo{order:-1;justify-self:start;max-width:220px}}
.hrecs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.hrecs{grid-template-columns:1fr}}
.hrec{display:flex;flex-direction:column;gap:clamp(16px,2vw,28px);background:var(--surface);border-radius:var(--r);padding:clamp(20px,3vw,40px);overflow:hidden;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.hrec:hover{transform:translateY(-4px)}
.hrec-t{display:flex;flex-direction:column;gap:4px}
.hrec-t .mono{color:var(--mute)}
.hrec-t h3{font-size:clamp(28px,3.4vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.hrec-t p{color:var(--mute);font-size:15px}
.hrec-t .link{margin-top:8px;font-size:15px}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;aspect-ratio:2/1}
.bento a{position:relative;display:block;overflow:hidden;border-radius:22px;background:var(--surface-2)}
.bento a:first-child{grid-column:1/3;grid-row:1/3}
.bento img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.bento a:hover img{transform:scale(1.04)}
.bento .tag{position:absolute;left:12px;bottom:12px;padding:5px 11px;border-radius:980px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
@media (max-width:760px){.bento{aspect-ratio:auto;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none}.bento a{aspect-ratio:4/5}.bento a:first-child{grid-column:1/3;grid-row:auto}}
.vt{background:#000;color:#f5f5f7;border-radius:var(--r);padding:clamp(22px,3.5vw,48px)}
.vt-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:clamp(20px,3vw,32px)}
.vt-head p{color:#a1a1a6;margin-top:8px}
.vt-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.vt-c{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:#111;color:#fff}
.vt-c img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.vt-c::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.7))}
.vt-c:hover img{transform:scale(1.05)}
.vt-c .t{position:absolute;left:14px;bottom:12px;z-index:1;font-size:14px;font-weight:600}
@media (max-width:760px){.vt-row{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:42%;overflow-x:auto;scrollbar-width:none}.vt-row::-webkit-scrollbar{display:none}}
.btn-light-ghost{background:transparent;color:#f5f5f7;border-color:rgba(255,255,255,.4)}

/* resume (home) */
.resume-wrap{padding-top:clamp(20px,3vw,40px)}
.resume{background:var(--surface);border-radius:var(--r);padding:clamp(22px,4vw,56px)}
.r-top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.r-photo{aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--surface-2)}
.r-photo img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute)}
.ph span{font-size:clamp(72px,10vw,120px);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--fg);opacity:.85}
.r-name{font-size:clamp(38px,5.6vw,72px);line-height:1.02;margin-top:6px;text-wrap:balance}
.r-full{color:var(--mute);font-size:18px;margin-top:6px}
.r-title{font-size:clamp(19px,2.2vw,26px);font-weight:600;letter-spacing:-.015em;margin-top:10px}
.tl{position:relative;margin-top:6px;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-i{position:relative;display:flex;flex-direction:column;gap:3px;padding-bottom:20px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--green)}
.tl-i:first-child::before{background:var(--green)}
.tl-p{font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:.02em}
.tl-i>span:not(.tl-p){color:var(--mute);font-size:14px}
.r-sum{color:var(--accent);font-weight:600;margin-top:14px;max-width:52ch}
.r-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:14px;color:var(--mute)}
.r-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,40px);margin-top:clamp(28px,4vw,48px);padding-top:clamp(24px,3vw,36px);border-top:1px solid var(--line)}
.r-h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.r-i{padding-block:10px;border-top:1px solid var(--line)}
.r-i:first-of-type{border-top:0;padding-top:0}
.r-i b{display:block;font-weight:600;font-size:15px;line-height:1.35}
.r-i span{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.r-sk{margin-bottom:12px}
.r-sk small{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.r-sk .chips{margin-top:0;gap:6px}
.r-sk .chip{min-height:28px;padding:0 11px;font-size:13px}
@media (max-width:900px){.r-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.r-top{grid-template-columns:1fr}.r-photo{max-width:240px}.r-cols{grid-template-columns:1fr}}

/* editor */
.ba{--p:50;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/2;background:var(--surface-2);user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .before{filter:grayscale(.4) contrast(.78) brightness(1.08) saturate(.6)}
.ba .after-l{position:absolute;inset:0;clip-path:inset(0 0 0 calc(var(--p)*1%))}
.ba .bar{position:absolute;top:0;bottom:0;left:calc(var(--p)*1%);width:2px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.4);pointer-events:none}
.ba .bar::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.ba .tag{position:absolute;top:16px;padding:6px 12px;border-radius:980px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(8px)}
.ba .tag.l{left:16px}.ba .tag.r{right:16px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.reels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:640px){.reels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reel{position:relative;aspect-ratio:9/16;border-radius:var(--r);overflow:hidden;background:var(--surface-2);color:#fff;display:flex;align-items:flex-end;padding:18px}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.65))}
.reel span{position:relative;font-weight:600;font-size:15px}
.play{position:absolute;top:50%;left:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;color:#1d1d1f}
.play svg{width:22px;height:22px;margin-left:3px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.step b{display:block;font-size:14px;color:var(--mute);font-weight:600;margin-bottom:28px;font-variant-numeric:tabular-nums}
.step h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
.step p{color:var(--mute);font-size:15px}

/* photographer: record crate */
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border-radius:980px;flex-wrap:wrap}
.seg button{min-height:36px;padding:0 18px;border:0;border-radius:980px;background:transparent;color:var(--mute);font-size:14px;font-weight:500;cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.rec{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(20px,4vw,56px);align-items:center;margin-top:20px;overflow:hidden}
@media (max-width:860px){.rec{grid-template-columns:1fr}}
.rec-art{container-type:inline-size;position:relative;aspect-ratio:100/84;width:100%;max-width:640px;margin-inline:auto}
.rec-art>*{position:absolute}
.sleeve{left:13cqw;top:4cqw;width:58cqw;aspect-ratio:4/5;z-index:3;padding:0;border:0;border-radius:.6cqw;overflow:hidden;background:var(--surface-2);box-shadow:0 2.4cqw 6cqw var(--shadow);cursor:zoom-in;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.sleeve:hover{transform:translateY(-1cqw) rotate(-.6deg)}
.sleeve img{width:100%;height:100%;object-fit:cover;animation:swap .7s cubic-bezier(.2,.7,.2,1) both}
.disc{left:42cqw;top:12cqw;width:56cqw;aspect-ratio:1;border-radius:50%;z-index:2;background:radial-gradient(circle,#000 0 33%,transparent 33%),repeating-radial-gradient(circle,#0a0a0b 0 .45cqw,#232326 .45cqw .9cqw);box-shadow:0 1.4cqw 4cqw var(--shadow);animation:spin 10s linear infinite;transition:left .6s cubic-bezier(.2,.7,.2,1)}
.rec-art:hover .disc{left:46cqw}
.disc-l{position:absolute;inset:31%;border-radius:50%;overflow:hidden;border:.5cqw solid #111}
.disc-l img{width:100%;height:100%;object-fit:cover;transform:scale(1.5)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:2.2cqw;height:2.2cqw;margin:-1.1cqw;border-radius:50%;background:var(--surface)}

<script>
const S = window.SITE;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';

const ARR_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
const IC = (() => {
  const w = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  return {
    mail: w('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/>'),
    chat: w('<path d="M5 4.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 3.5V16.5H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/><path d="M8 9.5h8M8 12.5h5"/>'),
    camera: w('<path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>'),
    phone: w('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>')

})();

/* ---------- normalize data ---------- */
S.galleries.forEach(g => {
  g.photos = g.photos.map(p => typeof p === 'string' ? { f: p } : p);

});

  ...S.galleries.map(g => ({ id: g.id, title: g.title, blurb: g.blurb, audio: g.audio || '', items: g.photos }))
].filter(r => r.items.length);
const ROUTES = [
  { id: 'home', label: 'Home' },
  { id: 'info', label: 'Info' },
  { id: 'editor', label: 'Editor' },
  { id: 'photographer', label: 'Photographer', short: 'Photo' },
  { id: 'videographer', label: 'Videographer', short: 'Video' },
  { id: 'other', label: 'Other' }
];
const pick = (src, alt) => ({ src, alt });
const cover = {
  editor: ALL.find(p => p.f === 'color-04.jpg') || ALL[0],
  photographer: ALL.find(p => p.f === 'bw-01.jpg') || ALL[0],

};

/* ---------- shell: nav, menu, contact ---------- */
$('#nav-links').innerHTML = ROUTES.map(r => `<a href="#${r.id}" data-r="${r.id}"><span class="full">${r.label}</span><span class="short">${r.short || r.label}</span></a>`).join('');

const soc = [];
document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = IC[el.dataset.ic] || ''; });
const igs = (Array.isArray(S.contact.instagram) ? S.contact.instagram : String(S.contact.instagram || '').split(',')).map(x => x.trim().replace(/^@/, '')).filter(Boolean);
if (igs.length) {
  $('#ig-row').hidden = false;
  $('#ig-text').textContent = igs.map(h => '@' + h).join('  ·  ');
  $('#ig-btns').innerHTML = igs.map((h, i) => `<a class="btn${i ? ' btn-ghost' : ''}" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(h)}">Open @${esc(h)}</a>`).join('');
}
const tel = S.contact.phone || '';
const metaHtml = () => [['mail', S.contact.email], S.contact.line && ['chat', 'LINE ' + S.contact.line], igs.length && ['camera', igs.map(h => '@' + h).join(' · ')], tel && ['phone', tel]]
  .filter(Boolean).map(([i, t]) => `<span>${IC[i]}${esc(t)}</span>`).join('');

$('#foot-c').textContent = '© 2026 ' + S.name + '. All photographs belong to the photographer.';
const lineId = S.contact.line;

function bindCopy(btn, text, el) {
  btn.addEventListener('click', async () => {
    const old = btn.textContent;

/* ---------- views ---------- */
function homeView() {
  const I = S.info, P = S.profile || {}, H = S.home || {};

  const recDefs = (H.records && H.records.length ? H.records : S.galleries.slice(0, 2).map(g => ({ id: g.id }))).slice(0, 2);

    const main = byF(d.main) || g.photos[0];
    let minis = (d.minis || []).map(byF).filter(p => p && p !== main);
    if (!minis.length) minis = g.photos.filter(p => p !== main);
    return { g, main, minis: minis.slice(0, 3) };
  }).filter(Boolean);
  const recCards = recs.map(({ g, main, minis }, i) => `
    <a class="hrec" href="#photographer" data-goto-photo="${esc(g.id)}:${g.photos.indexOf(main)}" aria-label="Open the ${esc(g.title)} record, ${g.photos.length} frames">
      <div class="rec-art" data-aud="${esc(g.id)}">
        ${minis.map((p, j) => `<span class="mini" style="--x:${HMINI[j][0]};--y:${HMINI[j][1]};--r:${HMINI[j][2]}"><img src="${esc(p.src)}" alt="" loading="lazy"></span>`).join('')}
        <div class="disc" aria-hidden="true"><div class="disc-l"><img src="${esc(main.src)}" alt=""></div></div>
        <span class="sleeve"><img src="${esc(main.src)}" alt="${esc(main.alt)}" loading="lazy"></span>
      </div>
      <div class="hrec-t"><span class="mono">Record ${pad(i + 1)}</span><h3>${esc(g.title)}</h3><p>${g.photos.length} frames</p><span class="link">Open record</span></div>
    </a>`).join('');
  const vids = ((H.videos && H.videos.length) ? H.videos : [0, 1, 2, 3]).map(i => ({ v: S.videos[i], i })).filter(x => x.v).slice(0, 4);
  const meta = metaHtml();
  return `
  <section class="wrap home-hero">
    <div>

/* ---------- hover-to-play record audio ---------- */
const players = {}; let hovId = null;
function audioFor(id) {
  const r = RECORDS.find(x => x.id === id); if (!r || !r.audio) return null;
  if (!players[id]) { const a = new Audio(encodeURI(r.audio)); a.loop = true; a.preload = 'none'; a.volume = 0; players[id] = a; }
  return players[id];
}
function fade(a, to, ms, done) {

  a._t = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms); a.volume = Math.max(0, Math.min(1, s + (to - s) * k));
    if (k >= 1) { clearInterval(a._t); if (done) done(); }
  }, 40);
}
function recPlay(id) { const a = audioFor(id); if (!a) return; try { const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} fade(a, .8, 500); }

function recLeave(force) { if (lockId && !force) return; if (hovId) { recStop(hovId); hovId = null; } }
function recSet(id) {

}

/* browsers block sound until the first click/tap/key: retry on it if a record is under the cursor */
